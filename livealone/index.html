      // 저장된 테마를 React 로딩 전에 적용해 깜빡임을 막는다 (src/state/theme.ts 와 같은 키)
      try {
        var t = localStorage.getItem('solo-living-master:theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t;
          document.documentElement.dataset.themeSource = 'app';
        }
      } catch (e) {}
    </script>
