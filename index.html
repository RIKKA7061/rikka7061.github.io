<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eleven</title>
  <style>
    body
    {
      background-color: black;
      color:white;
      font-family: Consolas, "Courier New", monospace;
      font-size: 16px;
      margin: 0;
      padding: 20px;
    }
    a
    {
      color: skyblue;
    }
    .line
    {
      white-space: pre-wrap;
      margin: 4px 0;
    }
    .prompt
    {
      color: #4ade80;
    }
    #input-line
    {
      display: flex;
      line-height: 1.5em;
    }
    /* 입력칸 + 회색 추천 글씨를 겹쳐 놓는 상자 */
    #input-wrap
    {
      position: relative;
      flex: 1;
      margin-left: 8px;
    }
    #cmd
    {
      position: relative;
      width: 100%;
      height: 1.5em;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font: inherit;
      line-height: 1.5em;
      padding: 0;
      margin: 0;
    }
     /* 회색 추천 글씨 (입력칸 뒤에 깔림) */
     #ghost
    {
      position: absolute;
      left: 0;
      top: 0;
      color: #666;
      white-space: pre;
      pointer-events: none;
    }
    #ghost .typed
    {
      color: transparent;
    }
    
  </style>
</head>

  
<body>
  <div id="output"></div>
  <div id="input-line">
    <span class="prompt">eleven:~$</span>
    <div id="input-wrap">
      <span id="ghost"> </span>
      <input id="cmd" type="text" autofocus autocomplete="off" spellcheck="false">
    </div>
  </div>
  
  <script>
    const output = document.getElementById("output");
    const cmd = document.getElementById("cmd");
    const ghost = document.getElementById("ghost");

    // 명령어 목록, (명령어:출력할내용)의 형식으로 추가 가능
    const commands =
    {
      help: "command list: help, about, launch_link, portfolio_link, next, clear",
      about: "(name: Eleven) <br>(class: game dev, prompt engineer) <br>(part: Engineer, Design) <br>(program: Unity, CLAUDE, github)", // (tmi: 2004, man, south korea, honorable discharge at ROKA)
      launch_link: 'Launch: <a href="https://play.google.com/store/apps/dev?id=8043178918719227338&hl=ko" target="_blank">playstore</a>',
      portfolio_link: 'Launch: <a href="https://eleven.me.kr/portfolio/" target="_blank">portfolio</a>',
      next:  "steam launch"
    };

    // 자동완성에 쓸 전체 명령어 이름 (commands 목록 + clear)
    const allCommands = Object.keys(commands).concat("clear");
    
    // 화면에 한 줄 출력 (출력할 때 출력 방식인듯;;)
    function print(html)
    {
      const div = document.createElement("div");
      div.className = "line";
      div.innerHTML = html;
      output.appendChild(div);
    }

    // 입력한 글자 속 < > & 기호가 HTML로 실행되지 않게 바꿔주기
    function escapeHtml(text)
    {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // 입력한 글자로 시작하는 명령어 찾기 (없으면 빈 글자)
    function findSuggestion(text)
    {
      if (text == "") return "";

      for (const name of allCommands)
      {
        if (name.startsWith(text) && name != text) return name;
      }
      return "";
    }

    // 회색 추천 글씨 업데이트
    function updateGhost()
    {
      const text = cmd.value.toLowerCase();
      const suggestion = findSuggestion(text);
      if(suggestion == "")
      {
        ghost.innerHTML = "";
      }
      else
      {
        // 이미 친 부분은 투명하게 나머지만 회색으로 보여줌
        ghost.innerHTML = '<span class="typed">' + escapeHtml(cmd.value) + '</span>' + suggestion.slice(text.length);
      }
    }

    // 글자를 칠 때마다 추천 업데이트
    cmd.addEventListener("input", updateGhost);

    // tab 또는 -> 키를 누르면 추천 명령어로 채우기
    cmd.addEventListener("keydown", function(e)
    {
      if (e.key != "Tab" && e.key != "ArrowRight") return;

      // -> 키는 커서가 맨 끝에 있을 때만 자동완성
      if (e.key == "ArrowRight" && cmd.selectionStart != cmd.value.length) return;

      const suggestion = findSuggestion(cmd.value.toLowerCase());
      if(suggestion != "")
      {
        e.preventDefault();
        cmd.value = suggestion;
        updateGhost();
      }
      else if (e.key == "Tab")
      {
        e.preventDefault(); // 추천이 없어도 Tab 때문에 입력칸 밖으로 나가지 않게
      }
    });                 
    
    // hello world!
    print("Well Come ~");
    print("Enter 'help'");
    
    // 엔터 눌렀을 때 실행되는 것들
    cmd.addEventListener("keydown", function (e)
    {
      if (e.key !== "Enter") return;

      let text = cmd.value.trim().toLowerCase();

      // 명령어를 끝까지 안 쳐도, 추천(회색 글씨)이 있으면 그걸로 채워서 실행 (모바일용: ab + 엔터 → about)
      if (!commands.hasOwnProperty(text) && text != "clear")
      {
        const suggestion = findSuggestion(text);
        if (suggestion != "") text = suggestion;
      }

      cmd.value = "";
      updateGhost(); // 입력칸을 비운 뒤에 회색 추천 글씨도 지우기
      print('<span class="prompt">eleven:~$</span> ' + escapeHtml(text));

      if (text == "")
      { 
        print("if you in trouble, you can enter 'help'");
      }
      else if (text == "clear")
      {
        output.innerHTML = "";
      }
      else if (commands.hasOwnProperty(text))
      {
        print(commands[text]);
      }
      else
      {
        print("command not found: " + escapeHtml(text));
        print("if you in trouble, you can enter 'help'");
      }

      window.scrollTo(0, document.body.scrollHeight);
    });

    // 화면 아무 데나 클릭시(단, 글자 드래그 제외) -> 입력칸 커서로 이동
    document.addEventListener("click", function()
    {
      if (!window.getSelection().toString()) cmd.focus();
    });
                               
  </script>
</body>

</html>
