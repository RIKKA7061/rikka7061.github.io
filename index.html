<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eleven</title>
  <style>
    body
    {
      background-color: black;
      color:white;
      font-family: Consolas, "Courier New", monospace;
      font-size: 16px;
      margin: 0;
      padding: 20px;
    }
    a
    {
      color:skyblue;
    }
    .line
    {
      white-space: pre-wrap;
      margin: 4px 0;
    }
    .prompt
    {
      color: #4ade80;
    }
    #input-line
    {
      display: flex;
    }
    #cmd
    {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font: inherit;
      margin-left: 8px;
    }
  </style>
</head>

<body>
  <div id="output"></div>
  <div id="input-line">
    <span class="prompt">eleven:~$</span>
    <input id="cmd" type="text" autofocus autocomplete="off" spellcheck="false">
  </div>

  <script>
    const output = document.getElementById("output");
    const cmd = document.getElementById("cmd");

    // 명령어 목록, (명령어:출력할내용)의 형식으로 추가 가능
    const commands =
    {
      help: "command list: help, about, launch_link, next, clear",
      about: "(name: Eleven) (class: game dev, prompt engineer) (part: Engineer, Design) (program: Unity, CLAUDE, github)", // (tmi: 2004, man, south korea, honorable discharge at ROKA)
      launch_link: 'Launch: <a href="https://play.google.com/store/apps/dev?id=8043178918719227338&hl=ko" target="_blank">playstore</a>',
      next:  "steam launch"
    };

    // 화면에 한 줄 출력 (출력할 때 출력 방식인듯;;)
    function print(html)
    {
      const div = document.createElement("div");
      div.className = "line";
      div.innerHTML = html;
      output.appendChild(div);
    }

    // 입력 오류 방지 인듯..
    function escapeHtml(text)
    {
      return text.replace(/&/g, "&amp:").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // hello world!
    print("Well Come.");
    print("you can input 'help' ");
    
    // 엔터 눌렀을 때 실행되는 것들
    cmd.addEventListener("keydown", function (e)
    {
      if (e.key !== "Enter") return;

      const text = cmd.value.trim().toLowerCase();
      cmd.value = "";
      print('<span class="prompt">eleven:~$</span> ' + escapeHtml(text));

      if (text == "")
      { 
        // 아무것도 입력 안 할시 
      }
      else if (commands.hasOwnProperty(text))
      {
        print(commands[text]);
      }
      else
      {
        print("command not found: " + escapeHtml(text));
      }

      window.scrollTo(0, document.body.scrollHeight);
    });

    // 화면 아무 데나 클릭시(단, 글자 드래그 제외) -> 입력칸 커서로 이동
    document.addEventListner("click", function()
    {
      if (!window.getSelection().toString()) cmd.focus();
    });
                               
  </script>
</body>
</html>
