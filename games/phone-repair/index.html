<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>고쳐줘요, 사장님!</title>
<meta name="description" content="작은 휴대폰 수리점에 매일 찾아오는 소녀 에밀리의 폰을 고쳐 주는 웹 게임.">
<meta property="og:title" content="고쳐줘요, 사장님!">
<meta property="og:description" content="작은 휴대폰 수리점에 매일 찾아오는 소녀 에밀리의 폰을 고쳐 주는 웹 게임.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📱</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
:root{
  --wood:#d8b6c8; --wood2:#c9a2b8; --mat:#2f6b5a; --mat2:#3a7d69;
  --ink:#2a1f1a; --paper:#fff8ee; --pink:#e86f98; --accent:#ff8a3d; --ok:#3bb273; --bad:#e5484d;
  --display:'Black Han Sans','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#4a3a52;color:var(--ink);font-family:var(--body);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:relative;max-width:560px;height:100dvh;margin:0 auto;display:grid;
  grid-template-rows:auto auto 1fr auto auto;
  background:repeating-linear-gradient(90deg,var(--wood) 0 38px,var(--wood2) 38px 40px);overflow:hidden}

/* 상단 바 */
.top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#3d2c4a;color:#ffeef6;font-size:14px}
.top .day{font-family:var(--display);font-size:18px;letter-spacing:.5px}
.top .sp{flex:1}
.top .chip{background:#ffffff1a;border-radius:99px;padding:3px 10px;font-variant-numeric:tabular-nums}
.top button{background:#ffffff1a;border:0;border-radius:99px;width:32px;height:28px}

/* 손님 영역 */
.cust{display:flex;align-items:flex-end;gap:8px;padding:8px 12px 0;min-height:96px}
.cust .girl{width:88px;flex:none;filter:drop-shadow(0 3px 0 #0002)}
.bubble{position:relative;flex:1;background:var(--paper);border-radius:14px;padding:10px 12px;margin-bottom:14px;
  font-size:15px;line-height:1.45;box-shadow:0 3px 0 #0002;min-height:46px}
.bubble::before{content:"";position:absolute;left:-8px;bottom:14px;border:8px solid transparent;border-right-color:var(--paper);border-left:0}
.bubble .who{font-weight:700;color:var(--pink);font-size:13px;display:block}

/* 작업대 */
.bench{position:relative;margin:6px 10px;border-radius:18px;background:
  linear-gradient(#ffffff10 1px,transparent 1px) 0 0/20px 20px,
  linear-gradient(90deg,#ffffff10 1px,transparent 1px) 0 0/20px 20px,var(--mat);
  box-shadow:inset 0 0 0 3px #00000022;touch-action:none;display:grid;place-items:center;overflow:hidden;min-height:0}
.stepbar{margin:0 10px;background:#3d2c4aee;color:#fff;border-radius:12px;padding:8px 12px;display:flex;align-items:center;gap:10px;font-size:14px}
.stepbar .num{font-variant-numeric:tabular-nums;color:#ffd29a;font-weight:700;flex:none}
.stepbar .txt{flex:1}
.stepbar button{border:0;background:#ffffff22;color:#fff;border-radius:99px;padding:4px 10px;font-size:13px;flex:none}
.tray{display:flex;gap:4px;padding:8px 10px calc(10px + env(safe-area-inset-bottom));overflow-x:auto;scrollbar-width:none}
.tool{flex:1 1 0;min-width:42px;max-width:72px;height:64px;border:0;border-radius:14px;background:var(--paper);box-shadow:0 3px 0 #0003;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;transition:transform .1s}
.tool svg{width:28px;height:28px}
.tool span{white-space:nowrap;font-size:11px;letter-spacing:-.3px}
.tool.sel{background:#ffd29a;transform:translateY(-4px);box-shadow:0 5px 0 #0003,0 0 0 3px var(--accent) inset}
.tool.part{background:#e9f6ff}
.tool.part.sel{background:#bfe6ff}

/* 휴대폰 */
.phone{position:relative;height:min(92%,440px);aspect-ratio:1/2;border-radius:30px;background:#1d1d22;
  box-shadow:0 10px 0 #0003,0 0 0 3px #3a3a44;transition:transform .5s}
.phone.flip{transform:rotateY(90deg)}
.phone [data-p]{position:absolute}
.phone [data-p]::after{content:"";position:absolute;inset:-10px}
.inner{position:absolute;inset:3%;border-radius:24px;background:#2b2b33;overflow:hidden}
.board{left:5%;top:3%;width:90%;height:36%;border-radius:10px;background:#1f7a4a;
  background-image:radial-gradient(#ffffff22 1px,transparent 1.5px);background-size:9px 9px}
.board::after{display:none}
.board.wet::before{content:"";position:absolute;inset:0;border-radius:10px;
  background:radial-gradient(circle at 70% 30%,#9fd8ff99 0 6%,transparent 7%),radial-gradient(circle at 30% 70%,#9fd8ff99 0 5%,transparent 6%),radial-gradient(circle at 80% 75%,#9fd8ff99 0 4%,transparent 5%),radial-gradient(circle at 55% 50%,#9fd8ff77 0 7%,transparent 8%)}
.ic{position:absolute;background:#222;border-radius:3px;box-shadow:0 0 0 2px #888 inset}
.c1{left:50%;top:14%;width:26%;height:30%}.c2{left:78%;top:16%;width:14%;height:22%}.c3{left:56%;top:56%;width:18%;height:20%}
.rust{width:14%;height:16%;border-radius:50%;background:radial-gradient(#a3622a,#7a4a1c 60%,transparent 70%)}
.r1{left:14%;top:58%}.r2{left:78%;top:52%}.r3{left:40%;top:10%}
.cam{left:7%;top:8%;width:26%;height:42%;border-radius:8px;background:#444;box-shadow:0 0 0 2px #777 inset}
.cam i{position:absolute;inset:18% 20%;border-radius:50%;background:radial-gradient(#4a6cff 0 20%,#111 22%);box-shadow:0 0 0 3px #222}
.cam.broken i{background:radial-gradient(#4a6cff 0 20%,#111 22%),linear-gradient(45deg,transparent 46%,#fff 48%,transparent 52%)}
.conn{left:42%;top:78%;width:18%;height:14%;border-radius:3px;background:#d9b44a;box-shadow:0 0 0 2px #8a6d1d inset;transition:transform .2s}
.conn.off{transform:translateY(-60%) rotate(-12deg);background:#e8cf7a}
.battery{left:9%;top:42%;width:82%;height:44%;border-radius:10px;background:linear-gradient(#3b3f52,#2c2f3e);
  box-shadow:0 0 0 3px #555 inset;display:grid;place-items:center;color:#cfd3e6;font-size:12px;font-weight:700;transition:transform .3s}
.battery.swollen{transform:scale(1.04,1.07);border-radius:30%/22%;background:radial-gradient(ellipse at 50% 45%,#5a5f78,#2c2f3e 70%)}
.battery.new{background:linear-gradient(#3e8ce0,#2a64b0);color:#fff}
.spk{position:absolute;left:30%;top:90%;width:40%;height:4%;border-radius:4px;background:repeating-linear-gradient(90deg,#555 0 4px,#333 4px 7px)}

.slot{opacity:0;pointer-events:none;border:2px dashed #fff;border-radius:10px;background:#ffffff14}
.slot.target{opacity:1;pointer-events:auto}
.slot-battery{left:9%;top:42%;width:82%;height:44%}
.slot-cam{left:7%;top:8%;width:26%;height:42%}
.gone{display:none!important}

.cover{inset:0;border-radius:30px;background:linear-gradient(160deg,#ffd6e3,#f7b3c9);transition:transform .35s,opacity .35s;box-shadow:0 0 0 3px #e79ab3 inset}
.cover::after{display:none}
.cover.off{opacity:0;transform:translate(14%,-6%) rotate(8deg);pointer-events:none}
.cover.off.target{opacity:.45;transform:none;pointer-events:auto;outline:3px dashed #fff;outline-offset:-6px}
.bump{position:absolute;left:8%;top:4%;width:34%;height:18%;border-radius:18px;background:#f0a5bd;box-shadow:0 0 0 2px #e18aa6 inset}
.lens{left:14%;top:10%;width:46%;height:46%;border-radius:50%;background:radial-gradient(#344 0 30%,#111 34%);box-shadow:0 0 0 3px #ddd}
.lens.cracked{background:linear-gradient(35deg,transparent 45%,#fff 47%,transparent 50%),linear-gradient(-60deg,transparent 52%,#fff 54%,transparent 57%),radial-gradient(#344 0 30%,#111 34%)}
.lens2{position:absolute;left:62%;top:60%;width:18%;height:22%;border-radius:50%;background:#fff8c8}
.logo{position:absolute;left:0;right:0;top:46%;text-align:center;font-family:var(--display);color:#e18aa6;font-size:15px}
.grill{left:30%;top:91%;width:40%;height:4%;border-radius:6px;background:radial-gradient(circle,#c9809a 30%,transparent 35%) 0 0/8px 100%}
.grill .dust,.port .lint{position:absolute;inset:-30% -6%;border-radius:8px;background:radial-gradient(#9b9488 0 40%,transparent 70%);pointer-events:none}
.screw{width:9%;aspect-ratio:1;border-radius:50%;background:#7a5562;box-shadow:inset 0 1px 2px #0008}
.screw b{position:absolute;inset:6%;border-radius:50%;background:radial-gradient(#eee,#999);transform:rotate(var(--rot,0deg));transition:transform .15s}
.screw b::before,.screw b::after{content:"";position:absolute;left:45%;top:15%;width:10%;height:70%;background:#555}
.screw b::after{transform:rotate(90deg)}
.screw.gone{display:block!important}.screw.gone b{display:none}
.s1{left:6%;top:3%}.s2{right:6%;top:3%}.s3{left:6%;bottom:2.5%}.s4{right:6%;bottom:2.5%}
.port{left:38%;bottom:-1%;width:24%;height:3.4%;border-radius:8px;background:#111;box-shadow:0 0 0 2px #666;z-index:3}
.port.plugged::before{content:"";position:absolute;left:20%;right:20%;top:70%;height:900%;background:linear-gradient(#eee,#ccc);border-radius:4px}
.pbtn{right:-3.5%;top:22%;width:3.5%;height:10%;border-radius:0 4px 4px 0;background:#555;z-index:3}

/* 앞면 */
.fboard{position:absolute;inset:6% 6% 40%;border-radius:10px;background:#1f7a4a}
.scable{left:40%;top:58%;width:20%;height:14%;border-radius:3px;background:#d9b44a;box-shadow:0 0 0 2px #8a6d1d inset;transition:transform .2s}
.scable.off{transform:translateY(-40%) rotate(14deg);background:#e8cf7a}
.scable.new{background:#9fe0b4}
.screen{inset:3%;border-radius:24px;background:#0d0f16;overflow:hidden;transition:transform .35s,opacity .35s,filter .3s}
.screen::after{display:none}
.screen svg.crack{position:absolute;inset:0;width:100%;height:100%;display:none}
.screen.cracked svg.crack{display:block}
.screen.warm{filter:sepia(.6) hue-rotate(-20deg) saturate(2)}
.screen.off{opacity:0;transform:translateX(70%) rotate(10deg);pointer-events:none}
.screen.off.target{opacity:.4;transform:none;pointer-events:auto;outline:3px dashed #fff;outline-offset:-6px}
.notch{position:absolute;left:40%;top:1.5%;width:20%;height:2%;border-radius:9px;background:#000;z-index:2}
.display{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;text-align:center;padding:12px;opacity:0;transition:opacity .6s}
.display.on{opacity:1}
.display .clock{font-size:42px;font-weight:700;letter-spacing:1px}
.display .msg{background:#ffffffe0;color:#222;border-radius:12px;padding:8px 10px;font-size:12px;text-align:left;margin-top:10px;width:92%}

/* 효과 */
.target.hint::before{content:"";position:absolute;inset:-6px;border-radius:12px;border:3px solid #ffe14d;animation:pulse 1s infinite;pointer-events:none;z-index:5}
@keyframes pulse{50%{opacity:.2;transform:scale(1.08)}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#cursor{position:fixed;width:44px;height:44px;margin:-22px 0 0 -6px;pointer-events:none;z-index:50;display:none;filter:drop-shadow(0 3px 2px #0006)}
#loupe{position:fixed;width:128px;height:128px;margin:-64px;border-radius:50%;overflow:hidden;pointer-events:none;z-index:48;display:none;
  background:var(--mat);box-shadow:0 0 0 4px #fff,0 8px 18px #0007}
#loupe .lp-in{position:absolute;inset:0}
#loupe .lp-x{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px #0008}
#loupe .lp-tool{position:absolute;right:10px;bottom:6px;width:30px;height:30px;background:#fff;border-radius:50%;padding:4px;box-shadow:0 2px 4px #0005}
#loupe .lp-tool svg{width:100%;height:100%}
#ring.big{width:146px;height:146px;margin:-73px;-webkit-mask:radial-gradient(transparent 62%,#000 64%);mask:radial-gradient(transparent 62%,#000 64%)}
#ring{position:fixed;width:56px;height:56px;margin:-28px;border-radius:50%;pointer-events:none;z-index:49;display:none;
  background:conic-gradient(#ffe14d calc(var(--p)*1%),#ffffff33 0);-webkit-mask:radial-gradient(transparent 55%,#000 57%);mask:radial-gradient(transparent 55%,#000 57%)}
.float{position:fixed;pointer-events:none;z-index:60;font-weight:700;font-size:16px;animation:up .8s forwards;text-shadow:0 2px 0 #0006;color:#fff}
@keyframes up{to{transform:translateY(-40px);opacity:0}}

/* 오버레이 (대화 · 결과 · 타이틀) */
.ov{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  background:linear-gradient(#0000 0,#00000088 60%);padding:16px}
.ov[hidden]{display:none}
.talk .bigirl{width:min(62vw,280px);filter:drop-shadow(0 6px 0 #0003);margin-bottom:-8px}
.talk .box{width:100%;background:var(--paper);border-radius:18px;padding:14px 16px 18px;min-height:112px;font-size:17px;line-height:1.55;box-shadow:0 5px 0 #0004;position:relative}
.talk .box .who{display:inline-block;background:var(--pink);color:#fff;font-weight:700;border-radius:99px;padding:1px 12px;font-size:14px;margin-bottom:6px}
.talk .box .who.me{background:#5b6bd6}
.talk .box .who.sys{background:#888}
.talk .next{position:absolute;right:16px;bottom:8px;font-size:12px;color:#999;animation:pulse 1s infinite}
.card{background:var(--paper);border-radius:22px;padding:22px;width:100%;max-width:400px;text-align:center;box-shadow:0 6px 0 #0004;margin:auto}
.card h2{font-family:var(--display);font-weight:400;margin:0 0 6px;font-size:26px}
.stars{font-size:40px;letter-spacing:4px;margin:6px 0}
.stars .off{opacity:.2}
.rows{display:grid;grid-template-columns:1fr auto;gap:6px 12px;text-align:left;margin:14px 0;font-size:15px}
.rows b{text-align:right;font-variant-numeric:tabular-nums}
.btn{display:block;width:100%;border:0;border-radius:14px;background:var(--accent);color:#fff;font-weight:700;font-size:17px;padding:13px;box-shadow:0 4px 0 #b65a1c;margin-top:10px}
.btn.line{background:#fff;color:var(--ink);box-shadow:0 4px 0 #0002,0 0 0 2px #ddd inset}
.title{justify-content:center;background:radial-gradient(circle at 50% 30%,#fff0f5,#d9c6ec)}
.title h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,10vw,52px);margin:0;color:#5a3a6a;text-align:center;line-height:1.1;text-shadow:0 4px 0 #fff8}
.title p.sub{margin:8px 0 18px;color:#8a5a8a;font-weight:600}
.title .girl{width:min(56vw,230px)}
.end-girl{width:150px;margin:6px auto}
img.girl-img{display:block;aspect-ratio:1;object-fit:cover;border-radius:22%;border:3px solid #fff;background:#fff}
.talk img.girl-img{border-radius:24px;border-width:5px;margin-bottom:10px}
.title img.girl-img{width:min(52vw,210px);margin-bottom:10px;transform:rotate(-3deg)}
.title .card{background:#fff8eef0}
.home{position:absolute;left:12px;top:10px;color:#6b3f27;font-size:13px;text-decoration:none;font-weight:600}
@media (max-height:640px){.cust{min-height:70px}.cust .girl{width:62px}.bubble{font-size:13px}.tool{height:54px}.tool svg{width:24px;height:24px}}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <span class="day" id="dayLbl">DAY 1</span><span class="sp"></span>
    <span class="chip" id="moneyLbl">₩0</span>
    <span class="chip" id="timeLbl">⏱ 0:00</span>
    <button id="muteBtn" aria-label="소리 켜기/끄기">🔊</button>
  </div>
  <div class="cust">
    <svg class="girl" id="girlS" viewBox="0 0 120 130" aria-hidden="true"></svg>
    <div class="bubble" id="bubble" aria-live="polite"><span class="who">에밀리</span><span id="bubbleTxt">…</span></div>
  </div>
  <div class="bench" id="bench"></div>
  <div class="stepbar"><span class="num" id="stepNum">0/0</span><span class="txt" id="stepTxt">준비 중</span><button id="hintBtn">힌트</button></div>
  <div class="tray" id="tray"></div>

  <div class="ov talk" id="talk" hidden>
    <svg class="girl bigirl" id="girlB" viewBox="0 0 120 130" aria-hidden="true"></svg>
    <div class="box"><span class="who" id="talkWho">에밀리</span><div id="talkTxt"></div><span class="next">▼ 탭해서 계속</span></div>
  </div>
  <div class="ov" id="result" hidden><div class="card" id="resultCard"></div></div>
  <div class="ov title" id="title">
    <a class="home" href="../../">← eleven.me.kr</a>
    <svg class="girl" id="girlT" viewBox="0 0 120 130" aria-hidden="true"></svg>
    <h1>고쳐줘요,<br>사장님!</h1>
    <p class="sub">작은 휴대폰 수리점 이야기</p>
    <div class="card" style="margin:0">
      <button class="btn" id="newBtn">새로 시작</button>
      <button class="btn line" id="contBtn" hidden>이어하기</button>
      <p style="font-size:13px;color:#6b5a4e;margin:12px 0 0">도구를 고르고 부품을 탭 · 길게 누르기 · 문지르기로 수리하세요.</p>
    </div>
  </div>
</div>
<div id="cursor"></div>
<div id="ring"></div>
<div id="loupe" aria-hidden="true"><div class="lp-in"></div><i class="lp-x"></i><span class="lp-tool"></span></div>

<script>
(() => {

const IMG = f => 'img/emily_' + (FACES[f]?f:'normal') + '.webp';
let useImg = true;
Object.keys(FACES).forEach(f => { const im=new Image(); im.onerror=()=>{ useImg=false; document.querySelectorAll('img.girl-img').forEach(i=>i.remove()); document.querySelectorAll('svg.girl').forEach(s=>s.style.display=''); }; im.src=IMG(f); });
function portrait(svg){
  if(!useImg) return null;
  let im = svg.previousElementSibling;
  if(!im || !im.classList.contains('girl-img')){
    im=document.createElement('img'); im.alt=''; im.className=svg.getAttribute('class')+' girl-img';
    svg.parentNode.insertBefore(im, svg); svg.style.display='none';
  }
  return im;
}
function face(f, els=girls){ const on=FACES[f]||FACES.normal;
  els.forEach(el => {
    el.querySelectorAll('[data-g]').forEach(g => g.style.display = on.includes(g.dataset.g)?'':'none');
    const im=portrait(el); if(im) im.src=IMG(f);
  }); }

let AC, muted=false;
function beep(f=600,d=.08,type='sine',v=.07){ if(muted) return; try{
  AC = AC || new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.value=f;
  g.gain.setValueAtTime(v,AC.currentTime); g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);
  o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime+d);
}catch(e){} }

      {t:'brush', ids:['rust1','rust2','rust3'], act:'rub', amt:200, label:'브러시로 부식된 곳 3군데 문질러 닦기',
        rub:(el,r)=>{ el.style.opacity = 1-r; }, each:el=>el.classList.add('gone')},
      {t:'heat', ids:['board'], act:'hold', ms:2000, label:'열풍기로 기판을 길게 말리기', done:()=>rem('board','wet')},
      ...closeBack(), power() ],
    boot:'alive',
    outro:[ G('살았다…! 사진도 메시지도 그대로야…','sad'), G('…고마워. 진짜로.','shy'), G('이, 이번 한 번만 솔직하게 말해 준 거야!','angry') ] },

  { name:'깨진 카메라', view:'back', parts:['part-camera','part-lens'], par:80, pay:70000,
    setup(){ add('lens','cracked'); add('cam','broken'); },
    intro:[ SYS('딸랑— 오늘은 어쩐지 들뜬 얼굴이다.'),
      G('오늘은 고장 난 게 아니라… 아니, 사실 고장 났어.','normal'),
      G('다음 주에 언니가 잠깐 한국에 와!','surprised'),
      G('같이 사진 찍고 싶은데, 카메라가 깨져 버렸어.','sad'),
      ME('그럼 제일 예쁜 사진이 나오게 고쳐 줘야겠네요.') ],
    steps:()=>[ ...openBack(),
      {t:'tweezers', ids:['cam'], act:'hold', ms:1000, label:'핀셋으로 깨진 카메라 모듈 빼내기', done:()=>add('cam','gone')},
      {t:'part-camera', ids:['slot-cam'], act:'tap', n:1, label:'새 카메라 모듈을 빈 자리에 끼우기', each:()=>{ rem('cam','gone'); rem('cam','broken'); }},
      ...closeBack(),
      {t:'part-lens', ids:['lens'], act:'tap', n:1, label:'새 렌즈로 뒷판의 깨진 렌즈 교체하기', each:el=>el.classList.remove('cracked')},
      power() ],
    boot:'photo',
    outro:[ G('찰칵! …엄청 선명해!','happy'),
      G('첫 사진은… 너랑 찍은 거야. 딱히 의미는 없거든!','shy'),
      G('그래도 이 폰에 추억이 계속 쌓이는 건, 네 덕분이야.','normal'),
      SYS('— 그 뒤로도 에밀리는 가끔 수리점에 들러, 언니와 찍은 사진을 자랑하고 갔다.') ] },
];

/* ---------- 저장 ---------- */
const KEY='eleven-phonefix-v1';
let save = { day:0, money:0, stars:[] };
function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s && typeof s.day==='number') save=s; }catch(e){} }
function store(){ try{ localStorage.setItem(KEY, JSON.stringify(save)); }catch(e){} }
load();

/* ---------- 화면 갱신 ---------- */
const won = n => '₩' + n.toLocaleString('ko-KR');
function hud(){ $('#dayLbl').textContent = 'DAY ' + (save.day+1); $('#moneyLbl').textContent = won(save.money); }
function say(text,f){ $('#bubbleTxt').textContent = text; if(f) face(f,[girls[0]]); }

/* ---------- 대화 ---------- */
let talkQ=[], talkDone=null, typing=null, full='';
function talk(lines, cb){ talkQ=lines.slice(); talkDone=cb; $('#talk').hidden=false; nextLine(); }
function nextLine(){
  if(typing){ clearInterval(typing); typing=null; $('#talkTxt').textContent=full; return; }
  const l = talkQ.shift();
  if(!l){ $('#talk').hidden=true; const cb=talkDone; talkDone=null; cb&&cb(); return; }
  const who=$('#talkWho');
  who.className='who'+(l.who==='me'?' me':l.who==='sys'?' sys':'');
  who.textContent = l.who==='g'?'에밀리':l.who==='me'?'나 (사장님)':'';
  who.style.display = l.who==='sys'?'none':'';
  $('#girlB').style.visibility = l.who==='sys'?'hidden':'visible';
  if(l.f) face(l.f);
  full=l.text; let i=0; const el=$('#talkTxt'); el.textContent='';
  typing=setInterval(()=>{ el.textContent=full.slice(0,++i); if(i%2) sfx.blip(); if(i>=full.length){ clearInterval(typing); typing=null; } },28);
}
$('#talk').addEventListener('click', nextLine);

/* ---------- 수리 진행 ---------- */
let R=null, tool='hand', timerId=null, hintId=null;
const bench=$('#bench');

function buildTray(parts){
  const tray=$('#tray'); tray.innerHTML='';
  [...BASE_TOOLS, ...parts].forEach(t => {
    const b=document.createElement('button'); b.className='tool'+(t.startsWith('part')?' part':''); b.dataset.t=t;
    b.innerHTML = ICON[t] + '<span>' + TOOLNAME[t] + '</span>'; b.setAttribute('aria-label', TOOLNAME[t]);
    b.onclick = () => pick(t); tray.appendChild(b);
  });
  pick('hand');
}
function pick(t){ tool=t; document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('sel', b.dataset.t===t));
  $('#cursor').innerHTML = ICON[t]; $('#loupe .lp-tool').innerHTML = ICON[t]; sfx.tap(); }

function startDay(){
  hud(); const D=DAYS[save.day];
  bench.innerHTML = D.view==='back' ? BACK() : FRONT();
  D.setup && D.setup();
  buildTray(D.parts);
  say('…','worried'); face('worried',[girls[0]]);
  $('#stepTxt').textContent='손님 이야기를 듣는 중';
  talk(D.intro, beginRepair);
}
function beginRepair(){
  const D=DAYS[save.day];
  R = { D, steps:D.steps(), i:-1, mistakes:0, t0:performance.now(), hints:0 };
  say('…잘 부탁해. 망가뜨리면 가만 안 둬.','normal');
  clearInterval(timerId);
  timerId=setInterval(()=>{ const s=Math.floor((performance.now()-R.t0)/1000); $('#timeLbl').textContent='⏱ '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); },250);
  nextStep();
}
function nextStep(){
  document.querySelectorAll('#phone .target').forEach(e=>e.classList.remove('target','hint'));
  R.i++;
  if(R.i >= R.steps.length) return finish();
  const st = R.st = R.steps[R.i];
  st.prog = {}; st.left = new Set(st.ids);
  st.ids.forEach(id => q(id).classList.add('target'));
  $('#stepNum').textContent = (R.i+1) + '/' + R.steps.length;
  $('#stepTxt').textContent = st.label;
  armHint();
}
function armHint(){ clearTimeout(hintId); hintId=setTimeout(showHint, 9000); }
function showHint(){ if(!R||!R.st) return; R.st.left.forEach(id=>q(id).classList.add('hint')); }
$('#hintBtn').onclick = () => { if(!R) return; R.hints++; showHint();
  say('반짝이는 데를 ' + TOOLNAME[R.st.t] + '(으)로 하면 되잖아. 바보.','smug'); };

function targetAt(el){
  while(el && el!==bench){ if(el.dataset && el.dataset.p && R.st.left.has(el.dataset.p)) return el; el=el.parentElement; }
  return null;
}
const MISS = ['야! 그 도구 맞아?','조, 조심해! 내 폰이라고!','그거 아닌 것 같은데…','흥, 서툴긴.'];
const CHEER = ['…제법인데?','오, 손 빠르네.','딱히 감탄한 건 아니야.','두근두근…','조금만 더!'];
function mistake(el,x,y){
  R.mistakes++; sfx.bad(); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
  pop(x,y,'✕ 도구가 달라요','#ffb3b3');
  say(MISS[Math.floor(Math.random()*MISS.length)], Math.random()<.5?'angry':'worried');
}
function pop(x,y,txt,color){ if(lpOn()){ x=parseFloat(loupe.style.left)-20; y=parseFloat(loupe.style.top)-LR-6; } const d=document.createElement('div'); d.className='float'; d.textContent=txt; d.style.left=x+'px'; d.style.top=y+'px'; if(color) d.style.color=color; document.body.appendChild(d); setTimeout(()=>d.remove(),800); }

function doneTarget(el,x,y){
  const st=R.st, id=el.dataset.p;
  if(!st.left.has(id)) return;
  st.left.delete(id); el.classList.remove('target','hint');
  st.each && st.each(el);
  sfx.tap(); if(x!=null) pop(x,y,'✓','#b7ffcf');
  if(!st.left.size){
    st.done && st.done(); sfx.ok();
    if(Math.random()<.45) say(CHEER[Math.floor(Math.random()*CHEER.length)], Math.random()<.5?'surprised':'shy');
    const busy = R; setTimeout(()=>{ if(R===busy) nextStep(); }, 380);
  } else armHint();
}

/* 입력: 탭 · 길게 누르기 · 문지르기 */
let hold=null, rub=null;
const ring=$('#ring'), cursor=$('#cursor');

/* 돋보기: 터치하면 손가락 위쪽에 손가락 밑 부분을 크게 보여 준다 */
const loupe=$('#loupe'), LS=2.2, LR=64;
let lpPt=null, lpHideT=null, lpClonedAt=0;
const lpOn = () => loupe.style.display==='block';
function lpShow(x,y){ clearTimeout(lpHideT); lpPt={x,y}; loupe.style.display='block'; lpUpdate(true); }
function lpMove(x,y){ if(!lpOn()) return; lpPt={x,y}; lpUpdate(performance.now()-lpClonedAt>90); }
function lpHide(delay){ clearTimeout(lpHideT); lpHideT=setTimeout(()=>{ loupe.style.display='none'; lpPt=null; }, delay); }
function lpUpdate(reclone){
  const ph=$('#phone'); if(!ph||!lpPt) return;
  const r=ph.getBoundingClientRect(), box=loupe.querySelector('.lp-in');
  let c=box.firstChild;
  if(reclone || !c){
    c=ph.cloneNode(true); c.removeAttribute('id'); c.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));
    c.style.cssText=`position:absolute;left:0;top:0;margin:0;width:${r.width}px;height:${r.height}px;transform-origin:0 0;transition:none`;
    box.replaceChildren(c); lpClonedAt=performance.now();
  }
  c.style.transform=`translate(${LR-(lpPt.x-r.left)*LS}px,${LR-(lpPt.y-r.top)*LS}px) scale(${LS})`;
  let cx=lpPt.x, cy=lpPt.y-LR-62;                 // 기본: 손가락 위
  if(cy < LR+8) cy=lpPt.y+LR+62;                 // 위에 자리가 없으면 아래
  cx=Math.max(LR+6, Math.min(innerWidth-LR-6, cx));
  loupe.style.left=cx+'px'; loupe.style.top=cy+'px';
  if(hold) placeRing(lpPt.x,lpPt.y);
}
function placeRing(x,y){
  if(lpOn()){ ring.classList.add('big'); x=parseFloat(loupe.style.left); y=parseFloat(loupe.style.top); }
  else ring.classList.remove('big');
  ring.style.left=x+'px'; ring.style.top=y+'px';
}

bench.addEventListener('pointerdown', e => {
  if(!R || !R.st || R.ending) return;
  const st=R.st, el=targetAt(e.target), touch = e.pointerType!=='mouse';
  if(touch) lpShow(e.clientX,e.clientY); else { cursor.style.display='block'; moveCursor(e); }
  if(st.act==='rub' && tool===st.t){ rub={x:e.clientX,y:e.clientY}; bench.setPointerCapture(e.pointerId); rubAt(e); return; }
  if(!el) return;
  if(tool!==st.t) return mistake(el,e.clientX,e.clientY);
  armHint();
  if(st.act==='tap'){
    const k = st.prog[el.dataset.p] = (st.prog[el.dataset.p]||0)+1;
    st.tap && st.tap(el,k); sfx.tap();
    if(k >= (st.n||1)) doneTarget(el,e.clientX,e.clientY);
    if(touch) lpUpdate(true);
  } else if(st.act==='hold'){
    bench.setPointerCapture(e.pointerId);
    hold={el, x:e.clientX, y:e.clientY, last:performance.now()};
    placeRing(e.clientX,e.clientY); ring.style.display='block';
    holdTick();
  }
});
function holdTick(){
  if(!hold) return;
  const st=R.st, id=hold.el.dataset.p, now=performance.now();
  st.prog[id]=(st.prog[id]||0)+(now-hold.last); hold.last=now;
  const p=Math.min(100, st.prog[id]/st.ms*100); ring.style.setProperty('--p',p);
  if(Math.random()<.15) beep(300+p*6,.04,'square',.02);
  if(p>=100){ const h=hold; endHold(); doneTarget(h.el,h.x,h.y); if(lpOn()) lpUpdate(true); return; }
  requestAnimationFrame(holdTick);
}
function endHold(){ hold=null; ring.style.display='none'; }
function rubAt(e){
  const st=R.st, hit=document.elementFromPoint(e.clientX,e.clientY), el=hit&&targetAt(hit);
  const d=Math.hypot(e.clientX-rub.x, e.clientY-rub.y); rub.x=e.clientX; rub.y=e.clientY;
  if(!el) return;
  const id=el.dataset.p; st.prog[id]=(st.prog[id]||0)+d;
  const r=Math.min(1, st.prog[id]/st.amt); st.rub && st.rub(el,r);
  if(d>4 && Math.random()<.3) beep(2000+Math.random()*1500,.02,'triangle',.015);
  if(r>=1) doneTarget(el,e.clientX,e.clientY);
}
function moveCursor(e){ cursor.style.left=e.clientX+'px'; cursor.style.top=e.clientY+'px'; }
bench.addEventListener('pointermove', e => {
  if(e.pointerType==='mouse'){ cursor.style.display='block'; moveCursor(e); }
  if(rub && R && R.st) rubAt(e);
  if(e.pointerType!=='mouse') lpMove(e.clientX,e.clientY);
  else if(hold) placeRing(e.clientX,e.clientY);
});
const up = e => { rub=null; endHold(); if(e.pointerType!=='mouse'){ if(lpOn()) lpUpdate(true); lpHide(260); } };
bench.addEventListener('pointerup', up); bench.addEventListener('pointercancel', up);
bench.addEventListener('pointerleave', e => { if(e.pointerType==='mouse' && !hold && !rub) cursor.style.display='none'; });

/* ---------- 완료 · 부팅 화면 ---------- */
function bootScreen(kind){
  const now=new Date(), hh=now.getHours(), mm=String(now.getMinutes()).padStart(2,'0');
  const clock = `<div style="font-size:12px;opacity:.8">${now.getMonth()+1}월 ${now.getDate()}일</div><div class="clock">${hh}:${mm}</div>`;
  const C = {
    battery: clock + '<div style="font-size:14px">🔋 100%</div>',
    message: clock + '<div class="msg"><b>💌 언니</b><br>에밀리, 잘 지내? 여긴 눈이 와. 보고 싶다 🐰</div>',
    charge: '<div style="font-size:64px">⚡</div><div style="font-size:18px;font-weight:700">충전 중 · 12%</div>',
    alive: clock + '<div style="font-size:14px">다시 만나서 반가워요 :)</div>',
    photo: '<div style="width:86%;aspect-ratio:3/4;border:6px solid #fff;border-bottom-width:24px;border-radius:4px;background:linear-gradient(#ffd6a5,#ffadc6);display:grid;place-items:center;font-size:40px">✌️😊</div><div style="font-size:13px;margin-top:6px">첫 번째 사진</div>'
  };
  const bg = { battery:'#2a3a70', message:'#5b3a7a', charge:'#111', alive:'#1f5f50', photo:'#222' }[kind];
  bench.innerHTML = FRONT();
  const s=q('screen'); s.style.background=bg; s.classList.remove('target');
  const dsp=$('#display'); dsp.innerHTML=C[kind];
  requestAnimationFrame(()=>requestAnimationFrame(()=>dsp.classList.add('on')));
  if(kind==='photo'){ const f=document.createElement('div'); f.style.cssText='position:absolute;inset:0;background:#fff;z-index:9;transition:opacity .6s'; s.appendChild(f); setTimeout(()=>f.style.opacity=0,80); }
}
function finish(){
  R.ending=true; clearInterval(timerId); clearTimeout(hintId);
  const D=R.D, sec=(performance.now()-R.t0)/1000;
  $('#stepTxt').textContent='수리 완료!'; sfx.win();
  const ph=$('#phone'); ph.classList.add('flip');
  setTimeout(()=>{ bootScreen(D.boot); face('happy',[girls[0]]); say('켜졌다…!','happy'); }, 500);
  let stars = 3;
  if(sec > D.par) stars--; if(sec > D.par*1.8) stars--;
  if(R.mistakes >= 3) stars--; if(R.hints >= 3) stars--;
  stars = Math.max(1, stars);
  const pay = Math.round(D.pay * [0,.6,.8,1][stars]);
  const tip = stars===3 ? 10000 : 0;
  setTimeout(()=>showResult({sec,stars,pay,tip}), 2600);
}
function showResult({sec,stars,pay,tip}){
  const D=R.D, m=Math.floor(sec/60), s=Math.floor(sec%60);
  const react = stars===3 ? '벌써 끝났어?! …흥, 인정해 줄게.' : stars===2 ? '뭐, 나쁘지 않네. 고마워.' : '느려! …그래도 고쳐 줬으니까 봐줄게.';
  $('#resultCard').innerHTML = `
    <h2>DAY ${save.day+1} 수리 완료</h2><p style="margin:0;color:#6b5a4e;font-weight:600">${D.name}</p>
    <div class="stars">${[1,2,3].map(i=>`<span class="${i<=stars?'':'off'}">★</span>`).join('')}</div>
    <p style="margin:0;color:#6b5a4e">“${react}”</p>
    <div class="rows"><span>걸린 시간</span><b>${m}:${String(s).padStart(2,'0')} (목표 ${D.par}초)</b>
    <span>도구 실수</span><b>${R.mistakes}번</b><span>힌트 사용</span><b>${R.hints}번</b>
    <span>수리비</span><b>${won(pay)}</b>${tip?`<span>팁 💝</span><b>${won(tip)}</b>`:''}</div>
    <button class="btn" id="goBtn">계속</button>`;
  $('#result').hidden=false;
  $('#goBtn').onclick = () => {
    $('#result').hidden=true;
    save.money += pay+tip; save.stars[save.day]=Math.max(save.stars[save.day]||0, stars); hud();
    talk(D.outro, () => { save.day++; store(); R=null;
      if(save.day >= DAYS.length) ending(); else startDay(); });
  };
}
function ending(){
  const total = save.stars.reduce((a,b)=>a+(b||0),0);
  face('happy');
  $('#resultCard').innerHTML = `
    <h2>THE END</h2>
    <svg class="girl end-girl" viewBox="0 0 120 130">${GIRL}</svg>
    <p style="margin:6px 0 0">에밀리의 폰은 오늘도 잘 켜집니다.</p>
    <div class="rows"><span>모은 돈</span><b>${won(save.money)}</b><span>별</span><b>★ ${total} / ${DAYS.length*3}</b></div>
    <button class="btn" id="againBtn">처음부터 다시</button>
    <a class="btn line" href="../../" style="text-decoration:none;box-sizing:border-box">eleven.me.kr로</a>`;
  const svg=$('#resultCard svg'); face('happy',[svg]);
  $('#result').hidden=false;
  $('#againBtn').onclick = () => { save={day:0,money:0,stars:[]}; store(); $('#result').hidden=true; startDay(); };
}

/* ---------- 시작 ---------- */
if(save.day>0 && save.day<DAYS.length){ $('#contBtn').hidden=false; $('#contBtn').textContent=`이어하기 (DAY ${save.day+1})`; }
$('#newBtn').onclick = () => { save={day:0,money:0,stars:[]}; store(); $('#title').hidden=true; startDay(); };
$('#contBtn').onclick = () => { $('#title').hidden=true; startDay(); };
hud();
})();
</script>
</body>
</html>
