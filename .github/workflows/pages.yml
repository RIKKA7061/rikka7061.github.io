# 사이트 배포: main 에 올리면(웹에서 파일을 고쳐 Commit 해도) 자동으로 배포된다.
# 배포할 때마다, 그리고 매주 한 번 플레이스토어에서 게임 이미지를 새로 가져온다.
name: 사이트 배포

on:
  push:
    branches: [main, 'claude/**'] # claude/** 브랜치는 만들어 보기만 하고 배포하지 않음
  schedule:
    - cron: '17 3 * * 1' # 매주 월요일 낮 12시 17분(한국 시간): 스토어 이미지 새로고침
  workflow_dispatch: # Actions 탭에서 'Run workflow' 로 직접 실행

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 사이트 파일 모으기 (초안·설명서·도구 제외)
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_drafts' --exclude 'tools' \
            --exclude 'README.md' --exclude '_site' ./ _site/

      - name: 플레이스토어 이미지 가져오기
        run: |
          npm install --prefix tools --no-save --no-audit --no-fund google-play-scraper@10.1.3
          node tools/store-images.mjs _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
